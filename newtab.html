<!doctype html><html><body style='font-family:Arial;background:linear-gradient(135deg,#ffd1ea,#fff);padding:30px'>
<h1>🎀 Hello Kitty Ultra Final 🎀</h1>
<p>Dashboard activated.</p>
<input id=t placeholder='Task'><button onclick='a()'>Add Task</button><ul id=l></ul>
<p id=s></p><button onclick='xp()'>Gain XP</button>
<script>
function a(){let li=document.createElement('li');li.textContent=t.value;l.appendChild(li);t.value=''}
function xp(){let x=+(localStorage.x||0)+10;localStorage.x=x;s.textContent='XP: '+x}
s.textContent='XP: '+(localStorage.x||0)
</script></body></html>
